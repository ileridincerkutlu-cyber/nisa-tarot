name: Nisa Ahenk Kurulumu
on:
workflow_dispatch:
push:
paths:
- "nisa-ahenk-github-yuklemeye-hazir.zip"
permissions:
contents: write
jobs:
install:
runs-on: ubuntu-latest
steps:
- name: Depoyu indir
uses: actions/checkout@v4
with:
token: ${{ secrets.GITHUB_TOKEN }}
  - name: ZIP dosyasını aç
    run: |
      unzip -o nisa-ahenk-github-yuklemeye-hazir.zip -d .
      rm -f nisa-ahenk-github-yuklemeye-hazir.zip

  - name: Dosyaları kaydet
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add -A
      git diff --cached --quiet || git commit -m "Nisa Tarot Ahenk kurulumu"

      git push
